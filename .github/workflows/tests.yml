name: Build and test

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          # Safe to cache here: this workflow never publishes.
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run JEST tests
        env:
          TEST_USERNAME: ${{ secrets.TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        run: npm run test
        if: ${{ !(contains(github.event.pull_request.labels.*.name, 'skip-tests') && contains(fromJSON('["malteschlueter","saschafuchs","Landschy"]'), github.triggering_actor)) }}
